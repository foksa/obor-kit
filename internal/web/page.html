<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>obor</title>
<style>
  /* One accent; state colors only for state: green working, amber waiting, red needs-you/failed, grey free. */
  :root {
    --bg: #131312; --panel: #1b1b19; --raise: #232320; --line: #2f2e2a; --line-soft: #262522;
    --fg: #ecebe6; --fg-2: #c9c7bf; --muted: #8f8d85; --accent: #e08a65; --accent-soft: rgba(224, 138, 101, .14);
    --ok: #5cbf86; --wait: #e0a845; --bad: #ef6b62; --idle: #77756e;
    --ok-soft: rgba(92, 191, 134, .13); --wait-soft: rgba(224, 168, 69, .13); --bad-soft: rgba(239, 107, 98, .13);
    --idle-soft: rgba(143, 141, 133, .12);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f6f2; --panel: #ffffff; --raise: #f1efe9; --line: #e3e0d8; --line-soft: #eeebe4;
      --fg: #1e1d1a; --fg-2: #3d3b36; --muted: #75726a; --accent: #c4613c; --accent-soft: rgba(196, 97, 60, .1);
      --ok: #23874f; --wait: #a06a00; --bad: #c93a30; --idle: #8c8980;
      --ok-soft: rgba(35, 135, 79, .1); --wait-soft: rgba(160, 106, 0, .1); --bad-soft: rgba(201, 58, 48, .09);
      --idle-soft: rgba(117, 114, 106, .1);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f6f2; --panel: #ffffff; --raise: #f1efe9; --line: #e3e0d8; --line-soft: #eeebe4;
    --fg: #1e1d1a; --fg-2: #3d3b36; --muted: #75726a; --accent: #c4613c; --accent-soft: rgba(196, 97, 60, .1);
    --ok: #23874f; --wait: #a06a00; --bad: #c93a30; --idle: #8c8980;
    --ok-soft: rgba(35, 135, 79, .1); --wait-soft: rgba(160, 106, 0, .1); --bad-soft: rgba(201, 58, 48, .09);
    --idle-soft: rgba(117, 114, 106, .1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.55 var(--sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a.ln { color: var(--accent); }
  a.ln:hover { text-decoration: underline; text-underline-offset: 2px; }
  code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 28px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { font-weight: 650; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); display: inline-block; }
  #crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
  #crumbs a:hover { color: var(--fg); }
  #crumbs .sep { opacity: .5; }
  .spacer { flex: 1; }
  #live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #live i { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); display: inline-block; }
  #live.on i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  #live.stale i { background: var(--wait); }
  #theme {
    background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; width: 30px; height: 28px;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  #theme:hover { color: var(--fg); border-color: var(--muted); }

  main { padding: 28px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h1 .title { font-weight: 450; color: var(--fg-2); }
  .head { margin-bottom: 22px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .meta b { color: var(--fg-2); font-weight: 500; }
  section { margin: 0 0 28px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
  }
  h2 .count { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--fg-2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .pad { padding: 14px 16px; }
  .quiet { color: var(--muted); font-size: 13px; padding: 2px 0; margin: 6px 0; }
  .quiet > .dot:first-child { margin-right: 6px; vertical-align: 0; }

  /* state pills and dots */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 1px 9px 1px 8px; font-size: 12px;
    font-weight: 500; white-space: nowrap; background: var(--idle-soft); color: var(--muted); line-height: 20px;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.plain::before { display: none; }
  .t-ok { color: var(--ok); background: var(--ok-soft); }
  .t-wait { color: var(--wait); background: var(--wait-soft); }
  .t-bad { color: var(--bad); background: var(--bad-soft); }
  .t-idle { color: var(--muted); background: var(--idle-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--idle); }
  .dot.t-ok { background: var(--ok); } .dot.t-wait { background: var(--wait); } .dot.t-bad { background: var(--bad); }
  .tag { font: 11.5px var(--mono); color: var(--muted); background: var(--raise); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

  /* rows: a grid on desktop, stacked on a phone */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; gap: 4px 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line-soft); min-width: 0; }
  .row:first-child { border-top: 0; }
  a.row:hover { background: var(--raise); }
  .rows > .row:first-child { border-radius: 12px 12px 0 0; }
  .rows > .row:last-child { border-radius: 0 0 12px 12px; }
  .rows > .row:only-child { border-radius: 12px; }
  .work { grid-template-columns: 64px minmax(0, 1fr) 128px 150px 76px; }
  .roles { grid-template-columns: 96px minmax(0, 1fr) 128px 76px; }
  .setup2 { grid-template-columns: 96px minmax(0, 1fr); }
  .setup3 { grid-template-columns: 96px minmax(0, 1fr) 120px; }
  .lead { display: flex; flex-direction: column; min-width: 0; }
  .lead .ttl { color: var(--fg-2); }
  .sub2 { font-size: 12px; color: var(--muted); }
  .r { text-align: right; }
  .projects .row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 92px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }

  /* needs you */
  .needs { border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background: linear-gradient(var(--bad-soft), var(--bad-soft)), var(--panel); }
  .need { padding: 14px 16px; border-top: 1px solid color-mix(in srgb, var(--bad) 22%, var(--line)); }
  .need:first-child { border-top: 0; }
  .need .why { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer { display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 7px; background: var(--raise); border: 1px solid var(--line); overflow-wrap: anywhere; }

  /* pipeline */
  .pipe { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 10px; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 76px; min-width: 0; }
  .stage h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
  .stage .item { padding: 6px 0; border-top: 1px dashed var(--line-soft); }
  .stage .item:first-of-type { border-top: 0; padding-top: 0; }
  .stage.empty h4 { opacity: .6; }

  .steps { display: flex; align-items: center; gap: 0; margin: 18px 0 4px; flex-wrap: wrap; row-gap: 10px; }
  .step { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .step .n { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 10px; }
  .step.done { color: var(--fg-2); }
  .step.done .n { background: var(--fg-2); border-color: var(--fg-2); color: var(--bg); }
  .step.cur { color: var(--fg); font-weight: 600; }
  .step.cur .n { border-color: currentColor; box-shadow: 0 0 0 3px var(--accent-soft); }
  .step.cur.t-ok, .step.cur.t-wait, .step.cur.t-bad { background: none; }
  .step .bar { width: 28px; height: 1.5px; background: var(--line); margin: 0 8px; }
  .step.done .bar { background: var(--fg-2); opacity: .5; }

  /* lists: events, timeline */
  .list { display: flex; flex-direction: column; }
  .li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; padding: 7px 16px; border-top: 1px solid var(--line-soft); align-items: baseline; }
  .li:first-child { border-top: 0; }
  .li time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .li .txt { overflow-wrap: anywhere; color: var(--fg-2); }
  .li .txt q { quotes: none; color: var(--fg); }
  .fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { from { background: var(--accent-soft); } to { background: transparent; } }

  /* text blocks */
  .prose { padding: 4px 18px 10px; color: var(--fg-2); overflow-wrap: anywhere; }
  .prose h1, .prose h2, .prose h3, .prose h4 { color: var(--fg); text-transform: none; letter-spacing: 0; margin: 16px 0 6px; }
  .prose h1 { font-size: 17px; } .prose h2 { font-size: 15px; } .prose h3, .prose h4 { font-size: 14px; }
  .prose p { margin: 8px 0; }
  .prose ul { margin: 6px 0; padding-left: 20px; }
  .prose li { margin: 3px 0; }
  .prose code { background: var(--raise); border-radius: 5px; padding: 0 4px; font-size: 12px; }
  .prose pre { background: var(--raise); border-radius: 8px; padding: 10px 12px; overflow: auto; }
  .prose pre code { background: none; padding: 0; }
  .prose strong { color: var(--fg); font-weight: 600; }
  .fold { position: relative; max-height: 340px; overflow: hidden; }
  .fold::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--panel)); }
  .fold.open { max-height: none; }
  .fold.open::after { display: none; }
  .more { margin: 0 18px 14px; background: none; border: 1px solid var(--line); color: var(--fg-2); border-radius: 8px; padding: 4px 12px; font: 12.5px var(--sans); cursor: pointer; }
  .more:hover { border-color: var(--muted); color: var(--fg); }
  pre.text {
    margin: 0; padding: 12px 16px 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6;
    color: var(--fg-2); max-height: 70vh; overflow: auto;
  }
  .block { border-top: 1px solid var(--line-soft); }
  .block:first-child { border-top: 0; }
  .bhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 11px 16px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { transition: transform .15s; display: inline-block; color: var(--muted); }
  details[open] > summary .chev { transform: rotate(90deg); }
  details > summary:hover { background: var(--raise); }
  .toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .toggle:hover { color: var(--fg); background: none !important; }
  table.raw { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.raw td, table.raw th { text-align: left; padding: 5px 12px; border-top: 1px solid var(--line-soft); vertical-align: top; }
  table.raw th { color: var(--muted); font-weight: 500; border-top: 0; }
  /* setup: the distribution's level × type table and its 7 days / all switch (T-750) */
  table.dist td { text-align: right; font-size: 12.5px; }
  table.dist th { text-align: right; }
  table.dist th:first-child, table.dist td:first-child { text-align: left; }
  .seg { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
  .seg button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 2px 10px; font: 12px var(--sans); cursor: pointer; }
  .seg button.on { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; }
  .err { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
  .loading { color: var(--muted); padding: 40px 0; }

  @media (max-width: 900px) {
    .pipe { grid-auto-flow: row; }
    .stage.empty { display: none; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 700px) {
    header { padding: 10px 14px; gap: 10px; }
    main { padding: 18px 14px; }
    h1 { font-size: 19px; }
    #live span { display: none; }
    /* a row on a phone: its state line (lane, state, time) first, what it is about below */
    .work, .roles, .projects .row { display: flex; flex-wrap: wrap; align-items: center; column-gap: 10px; row-gap: 4px; }
    .setup2, .setup3 { display: flex; flex-wrap: wrap; align-items: center; column-gap: 10px; row-gap: 4px; }
    .work > .lead, .roles > .lead, .setup2 > .lead, .setup3 > .lead { order: 5; flex-basis: 100%; }
    .projects .row > .lead { flex-basis: 100%; }
    .row > .hide-sm { display: none; }
    .row > .r { margin-left: auto; }
    .li { grid-template-columns: 60px minmax(0, 1fr); padding: 7px 12px; }
    .steps .bar { width: 14px; margin: 0 5px; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><i></i>obor</a>
  <nav id="crumbs"></nav>
  <span class="spacer"></span>
  <span id="live" title="no live connection"><i></i><span>offline</span></span>
  <button id="theme" title="switch dark / light">◐</button>
</header>
<main id="app"><p class="loading">loading…</p></main>
<script>
"use strict";

// ---- helpers -------------------------------------------------------------------------------------------------------
const app = document.getElementById("app");
const enc = encodeURIComponent;
const dec = (s) => { try { return decodeURIComponent(s || ""); } catch (e) { return s || ""; } };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => Date.now() / 1000;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const unixOf = (ts) => { const t = Date.parse(ts); return isNaN(t) ? 0 : t / 1000; };

async function api(path, signal) {
  const r = await fetch(path, { cache: "no-store", signal });
  let body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  if (!r.ok) throw new Error((body && body.error) || r.status + " " + r.statusText);
  return body;
}

// dur is a duration in seconds as a person says it: 40s, 12m, 3h 05m, 2d 4h.
function dur(sec) {
  const s = Math.max(0, Math.floor(sec));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
  return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
}
function relText(at, mode) {
  const d = now() - at;
  if (mode === "for") return dur(d);
  if (mode === "in") return "in " + dur(-d);
  return d < 45 ? "just now" : dur(d) + " ago";
}
const clock = (at) => new Date(at * 1000).toLocaleString([], { hour12: false, month: "short", day: "numeric",
  hour: "2-digit", minute: "2-digit", second: "2-digit" });
// rel is a relative time that keeps itself current (the ticker), its clock time on hover; "" without a time.
function rel(at, mode) {
  if (!at) return "";
  return `<time data-at="${at}" data-mode="${mode || ""}" title="${esc(clock(at))}">${esc(relText(at, mode))}</time>`;
}
setInterval(() => {
  for (const t of document.querySelectorAll("time[data-at]")) t.textContent = relText(+t.dataset.at, t.dataset.mode);
}, 15000);

// tone is a state's color: green working, amber waiting, red needs-you or failed, grey free or idle.
function tone(state) {
  const s = String(state || "").toLowerCase();
  if (/^merge held/.test(s)) return "wait"; // its publish waits for the reviewer or the deep dive (T-718)
  if (/held|needs-you|fail|red|blocked|conflict|down|missing|dropped/.test(s)) return "bad";
  if (/pending|waiting|submitted|done|queued|not fetched|stuck|review requested|ready/.test(s)) return "wait";
  if (/working|gating|merging|review|resolv|running|green|accepted|published|merged|live|up|brief/.test(s)) return "ok";
  return "idle";
}
const pill = (state, text) => `<span class="pill t-${tone(state)}">${esc(text ?? state)}</span>`;
const dot = (state, title) => `<span class="dot t-${tone(state)}" title="${esc(title || state)}"></span>`;
// ttl is a spec title, escaped, its `code` spans as code.
const ttl = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const tag = (text, title) => `<span class="tag"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</span>`;

// ---- routes ---------------------------------------------------------------------------------------------------------
// Every link the page draws goes through href, and every kind it links is a key of ROUTES (web_test checks it).
const href = (kind, project, id) => "#/" + kind + (project !== undefined ? "/" + enc(project) : "") +
  (id ? "/" + enc(id) : "");
const ln = (url, text, title) => `<a class="ln" href="${url}"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</a>`;
const taskLink = (p, task, text) => task ? ln(href("t", p, task), text || task) : "";
const agentLink = (p, agent) => agent ? ln(href("a", p, agent), agent) : "";
const jobLink = (p, job, text) => job ? ln(href("j", p, job), text || job) : "";

const ROUTES = {
  p: { page: projectPage, crumb: (r) => [] },
  s: { page: setupPage, crumb: (r) => ["setup"] },
  t: { page: taskPage, crumb: (r) => [r.id] },
  a: { page: agentPage, crumb: (r) => ["agent " + r.id] },
  j: { page: jobPage, crumb: (r) => ["job " + r.id] },
};

// parse is a hash as a route: its kind, its project and its id (a job's id keeps its slashes, encoded or not).
function parse(hash) {
  const parts = String(hash || "").replace(/^#\/?/, "").split("/");
  return { kind: parts[0] || "", project: dec(parts[1]), id: parts.slice(2).map(dec).join("/") };
}

let nav = 0;          // bumps on every navigation: a slow answer never draws over another page
let current = null;   // { r, draw, my }: the page shown, to redraw on new records and on the refresh
async function go() {
  const my = ++nav;
  stopLive();
  const r = parse(location.hash);
  const def = r.kind ? ROUTES[r.kind] : { page: landing, crumb: () => [] };
  if (!def || (r.kind && !r.project)) { location.replace("#/"); return; }
  crumbs(r, def.crumb(r));
  app.innerHTML = '<p class="loading">loading…</p>';
  window.scrollTo(0, 0);
  // Every draw takes a ticket when it starts: an answer that lands after a later-started draw painted is dropped, so
  // the long poll's redraw and the refresh never paint an older read over a newer one.
  let started = 0, painted = 0;
  const draw = async (refresh) => {
    const ticket = ++started;
    const html = await def.page(r);
    if (my !== nav) return false;
    if (ticket < painted) return true;
    painted = ticket;
    paint(html, refresh);
    return true;
  };
  current = { r, draw, my };
  const ctl = new AbortController();
  poller = ctl;
  // The cursor is taken before the page's first read: a record that lands between the two is newer than the cursor,
  // so the long poll redraws the page (RV-76 #1). It only moves forward; when the read fails, a project seen before
  // keeps its cursor, and one never seen gets it from the live loop, which then draws again.
  if (r.project) {
    try { await takeCursor(r.project, ctl.signal); } catch (e) { /* kept, or taken by live */ }
  }
  if (my !== nav) return;
  // drawn is the first draw's real outcome (RV-76 #1): a page that failed to load is not live until a redraw succeeds.
  let drawn = false;
  try {
    if (!(await draw(false))) return;
    drawn = true;
  } catch (e) {
    if (my === nav) app.innerHTML = `<div class="banner t-bad">could not load this page: ${esc(e.message)}</div>`;
  }
  if (my !== nav) return;
  const st = { poll: true, drawn };
  if (r.project) live(my, r.project, ctl, draw, st);
  refreshLoop(my, draw, st);
}
window.addEventListener("hashchange", go);
// A click on a link to the page already shown changes no hash: draw it again rather than nothing.
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (a && a.getAttribute("href") === location.hash && !e.metaKey && !e.ctrlKey) { e.preventDefault(); go(); }
});

function crumbs(r, tail) {
  const el = document.getElementById("crumbs");
  const parts = [];
  if (r.project) parts.push(`<span class="sep">/</span>${ln(href("p", r.project), r.project).replace('class="ln"', "")}`);
  for (const t of tail) parts.push(`<span class="sep">/</span><span class="ell">${esc(t)}</span>`);
  el.innerHTML = parts.join("");
  document.title = (tail.length ? tail[tail.length - 1] + " · " : "") + (r.project ? r.project + " · " : "") + "obor";
}

// paint draws html; a refresh keeps the scroll, the open toggles and the unfolded texts.
function paint(html, refresh) {
  if (!refresh) { app.innerHTML = html; return; }
  const open = new Set([...app.querySelectorAll("details[data-key]")].filter((d) => d.open).map((d) => d.dataset.key));
  const closed = new Set([...app.querySelectorAll("details[data-key]")].filter((d) => !d.open).map((d) => d.dataset.key));
  const unfolded = new Set([...app.querySelectorAll(".fold.open[data-key]")].map((d) => d.dataset.key));
  const seen = new Set([...app.querySelectorAll("[data-seq]")].map((d) => d.dataset.seq));
  const y = window.scrollY;
  app.innerHTML = html;
  for (const d of app.querySelectorAll("details[data-key]")) {
    if (open.has(d.dataset.key)) d.open = true;
    if (closed.has(d.dataset.key)) d.open = false;
  }
  for (const d of app.querySelectorAll(".fold[data-key]")) if (unfolded.has(d.dataset.key)) unfold(d);
  for (const d of app.querySelectorAll("[data-seq]")) if (seen.size && !seen.has(d.dataset.seq)) d.classList.add("fresh");
  window.scrollTo(0, y);
}
app.addEventListener("click", (e) => {
  const b = e.target.closest("button.more");
  if (b) { unfold(document.getElementById(b.dataset.for)); return; }
  // the setup page's 7 days / all switch: only this page's table redraws (T-750)
  const seg = e.target.closest("button[data-dist]");
  if (seg) { distAll = seg.dataset.dist === "all"; if (current) current.draw(true); }
});
function unfold(el) {
  if (!el) return;
  el.classList.add("open");
  const b = app.querySelector(`button.more[data-for="${el.id}"]`);
  if (b) b.remove();
}

// ---- live -------------------------------------------------------------------------------------------------------
// One /api/events long poll per project page: any newer record redraws the page (state moves with the log).
const liveEl = document.getElementById("live");
let poller = null;
const cursors = {};   // project → the newest seq its shown pages are drawn past; only moves forward
const REFRESH_MS = 5000; // the shown page is read again this often: pane, connection and running state log no record
const RETRY_MS = 3000;   // a failed poll or redraw is tried again after this
function setLive(state, text) {
  liveEl.className = state;
  liveEl.querySelector("span").textContent = text;
  liveEl.title = state === "on" ? "live: new records and a refresh every few seconds redraw the page" : text;
}
// mark is the live mark from the poll's and the last draw's outcome: stale when either failed.
function mark(st) {
  if (!st.poll) setLive("stale", "reconnecting");
  else if (!st.drawn) setLive("stale", "refresh failed");
  else setLive("on", "live");
}
function stopLive() { if (poller) { poller.abort(); poller = null; } }
// advance moves a project's cursor forward to seq, never back.
function advance(project, seq) {
  if (cursors[project] === undefined || seq > cursors[project]) cursors[project] = seq;
}
// takeCursor reads the project's newest worded record as its cursor (an unworded record past it only redraws once).
async function takeCursor(project, signal) {
  const v = await api("/api/view?project=" + enc(project), signal);
  advance(project, (v.events || []).reduce((m, e) => Math.max(m, e.seq || 0), 0));
}
// live is one /api/events long poll per project page: a record past the cursor redraws the page, and only a redraw
// that succeeded moves the cursor past it (a failed one is tried again).
async function live(my, project, ctl, draw, st) {
  const alive = () => !ctl.signal.aborted && my === nav;
  let last = 0;
  let target = 0; // the seq a pending redraw moves the cursor to (0: none pending)
  mark(st);
  while (alive()) {
    if (cursors[project] === undefined) {
      try { await takeCursor(project, ctl.signal); } catch (e) {
        if (!alive()) return;
        st.poll = false; mark(st);
        await sleep(RETRY_MS);
        continue;
      }
      target = cursors[project]; // the page shown may be older than the cursor just taken: draw it again
    }
    if (!target) {
      let page;
      try {
        page = await api(`/api/events?project=${enc(project)}&since=${cursors[project]}`, ctl.signal);
      } catch (e) {
        if (!alive()) return;
        st.poll = false; mark(st);
        await sleep(RETRY_MS);
        continue;
      }
      if (!alive()) return;
      st.poll = true; mark(st);
      if ((page.seq || 0) <= cursors[project]) continue;
      target = page.seq;
    }
    const wait = 1200 - (Date.now() - last); // a burst of records redraws once
    if (wait > 0) await sleep(wait);
    if (!alive()) return;
    last = Date.now();
    try {
      if (!(await draw(true))) return;
      st.drawn = true;
      advance(project, target);
      target = 0;
    } catch (e) {
      if (!alive()) return;
      st.drawn = false; mark(st);
      await sleep(RETRY_MS);
      continue;
    }
    mark(st);
  }
}
// refreshLoop reads the shown page again every REFRESH_MS: what changes without a record (an agent's pane, serve's
// connection, a running command, a restart) shows up; a failed read turns the live mark stale.
async function refreshLoop(my, draw, st) {
  mark(st);
  while (my === nav) {
    await sleep(REFRESH_MS);
    if (my !== nav) return;
    try {
      if (!(await draw(true))) return;
      st.drawn = true;
    } catch (e) {
      if (my !== nav) return;
      st.drawn = false;
    }
    mark(st);
  }
}

// ---- wording ------------------------------------------------------------------------------------------------------
// human is a log line for a person: no [obor …] prefixes, a worktree path as its lane, other paths shortened.
function human(line) {
  let s = String(line || "").replace(/\[obor(?: [^\]]*)?\]\s*/g, "");
  s = s.replace(/(?:\/[\w.@+-]+){2,}\/?/g, (p) => {
    const m = p.match(/-wt\/([\w.-]+)(\/.*)?$/);
    if (m) return m[1] === "merge" ? "the merge worktree" + (m[2] || "") : m[1] + (m[2] || "");
    const segs = p.replace(/\/$/, "").split("/");
    return segs.length > 3 ? "…/" + segs.slice(-2).join("/") : p;
  });
  return s.trim();
}
// linked is escaped text with its task ids linked.
const linked = (p, text) => esc(text).replace(/\b(T-\d+)\b/g, (t) => taskLink(p, t));
// eventHTML is one worded event: a line to an agent as "→ agent: text", every task id a link.
function eventHTML(p, line) {
  const m = String(line || "").match(/^line to ([^:]+): ([\s\S]*)$/);
  if (m) return `<span class="muted">→</span> ${agentLink(p, m[1])} <q>${linked(p, human(m[2]))}</q>`;
  return linked(p, human(line));
}

// md is a spec's or report's markdown, readable: headings, lists, code blocks, inline code and bold; escaped first.
function md(text, p) {
  const inline = (s) => linked(p, s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/^(Summary|Self-check|Skipped|Open questions|Concerns|Blocked):/, "<strong>$1:</strong>");
  const out = [];
  let para = [], list = null, code = null;
  const flush = () => {
    if (para.length) { out.push("<p>" + para.map(inline).join(" ") + "</p>"); para = []; }
    if (list) { out.push("<ul>" + list.map((i) => "<li>" + inline(i) + "</li>").join("") + "</ul>"); list = null; }
  };
  for (const raw of String(text || "").split("\n")) {
    if (code !== null) {
      if (/^\s*```/.test(raw)) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
      else code.push(raw);
      continue;
    }
    if (/^\s*```/.test(raw)) { flush(); code = []; continue; }
    const h = raw.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = raw.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
    if (li) { if (para.length) { const l = list; list = null; flush(); list = l; } (list = list || []).push(li[1]); continue; }
    if (!raw.trim()) { flush(); continue; }
    if (list && /^\s+\S/.test(raw)) { list[list.length - 1] += " " + raw.trim(); continue; }
    if (list || /^(Summary|Self-check|Skipped|Open questions|Concerns|Blocked):/.test(raw)) flush(); // a report section
    para.push(raw.trim());
  }
  if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
  flush();
  return out.join("");
}
// folded is html in a box that shows its first part, with a button for the rest when it is long.
let foldN = 0;
function folded(key, html, long) {
  if (!long) return `<div class="prose">${html}</div>`;
  const id = "fold-" + (++foldN);
  return `<div class="prose fold" id="${id}" data-key="${esc(key)}">${html}</div>
    <button class="more" data-for="${id}">Show all</button>`;
}

// ---- landing ------------------------------------------------------------------------------------------------------
async function landing() {
  const ps = await api("/api/projects");
  if (!ps.length) return `<div class="head"><h1>Projects</h1></div>
    <p class="quiet">No obor project known on this machine yet — <code>obor init</code> or <code>obor serve</code> registers one.</p>`;
  const rows = ps.map((p) => {
    const state = p.error ? "fail" : !p.up ? "down" : p.needs_you ? "needs-you" : p.busy || (p.roles || []).length ? "working" : "free";
    const roles = (p.roles || []).map((x) => pill("working", roleName(x.role) + (x.status === "working" && x.age ? " " + dur(x.age) : x.status === "working" ? "" : " brief"))).join(" ");
    const running = (p.running || []).map((r) => pill("running", r.step + (r.task ? " " + r.task : ""))).join(" ");
    return `<a class="row" href="${href("p", p.name)}">
      <div class="lead"><div class="nowrap" style="display:flex;gap:9px;align-items:center">${dot(state)}
        <strong class="ell">${esc(p.name)}</strong></div>
        <span class="sub2 ell" title="${esc(p.root)}">${esc(p.root)}</span></div>
      <div class="stats">
        ${p.error ? `<span class="err small ell" title="${esc(p.error)}">${esc(p.error)}</span>` : `
        ${p.up ? "" : pill("down", "serve down")}
        ${p.needs_you ? pill("needs-you", p.needs_you + " needs you") : ""}
        ${p.busy ? pill("working", p.busy + " busy") : ""}
        <span class="pill plain t-idle">${p.free} free</span>
        ${p.queue ? pill("waiting", p.queue + " queued") : ""}
        ${roles}
        ${running}
        ${p.background ? pill("running", p.background + " bg") : ""}`}
      </div>
      <div class="r muted small">${p.up ? "serve up" : ""}</div>
    </a>`;
  }).join("");
  return `<div class="head"><h1>Projects</h1>
      <div class="meta">every obor project on this machine · read-only</div></div>
    <section><div class="card rows projects">${rows}</div></section>`;
}

// ---- project --------------------------------------------------------------------------------------------------------
async function projectPage(r) {
  const v = await api("/api/view?project=" + enc(r.project));
  return renderProject(r.project, v);
}

const FREE = new Set(["free", "dirty-free"]);

// bgHTML is an agent's long-running processes (T-714, T-727): one line each, bg (a recorded background call) or
// running (a long foreground command), its description or command and how long it has run.
const bgKind = (b) => (b.background ? "bg:" : "running");
function bgHTML(list) {
  return (list || []).map((b) => `<span class="sub2 ell bg" title="${esc("pid " + b.pid + ": " + b.command)}">${
    bgKind(b)} ${esc(b.label || b.command)} · ${dur(b.age)}</span>`).join("");
}
const roleName = (r) => String(r || "").replace(/_/g, " ");

function renderProject(p, v) {
  const s = v.serve || {};
  const lanes = v.lanes || [];
  const busy = lanes.filter((l) => !FREE.has(l.state));
  const free = lanes.filter((l) => FREE.has(l.state));
  const q = v.queue || {};

  // header
  const serve = s.up
    ? pill("up", "serve up " + (s.since ? dur(now() - unixOf(s.since)) : ""))
    : pill("down", "serve down");
  const warns = [];
  if (s.up && !s.project) warns.push(pill("pending", "project not loaded"));
  if (s.up && !s.merging) warns.push(pill("idle", "merge loop off"));
  if (s.up && !s.herdr) warns.push(pill("blocked", "herdr not connected"));
  if (s.log_error) warns.push(pill("fail", "log: " + s.log_error));
  for (const n of v.notes || []) warns.push(pill("pending", n)); // an unknown config key, a stopped project (T-709)
  const running = (v.running || []).map((x) => `<span class="pill t-ok">${esc(x.step)}${x.task ? " " : ""}${
    x.task ? taskLink(p, x.task) : ""}${x.command ? ` <span class="muted">${esc(x.command)}</span>` : ""}
    ${rel(x.since, "for")}</span>`).join(" ");
  const head = `<div class="head"><h1>${esc(p)}</h1>
    <div class="meta">${serve} ${warns.join(" ")} ${running}
      ${!s.up && s.error ? `<span class="small ell" title="${esc(s.error)}">${esc(human(s.error))}</span>` : ""}
      <a class="ln" href="${href("s", p)}">Setup</a></div></div>`;
  const paused = v.paused ? `<div class="banner t-wait">⏸ <span>Paused${v.paused.until ? " " +
    rel(v.paused.until, "in") : ""}${v.paused.reason ? ": " + esc(v.paused.reason) : ""}
    ${v.paused.by ? `<span class="muted">· ${esc(v.paused.by)}</span>` : ""}</span></div>` : "";

  // needs you
  const needs = v.needs_you || [];
  const needsHTML = needs.length ? `<section><h2>Needs you <span class="count">${needs.length}</span></h2>
    <div class="card needs">${needs.map((n) => `<div class="need">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${dot("needs-you")}
        <strong>${taskLink(p, n.task)}</strong>${n.lane ? tag(n.lane) : ""}<span class="muted small">${rel(n.since)}</span></div>
      <div class="why">${linked(p, human(n.reason))}</div>
      ${n.answer ? `<code class="answer">${esc(n.answer)}</code>` : ""}</div>`).join("")}</div></section>`
    : `<section><p class="quiet">${dot("working")} Nothing needs you.</p></section>`;

  // work in progress: busy lanes, then the role agents with a pane
  const work = busy.map((l) => {
    const job = l.job ? `${jobLink(p, l.job.id, l.job.id.split("/").slice(2).join("/") || l.job.id)}
      ${l.job.delivered ? "" : pill("not fetched")}` : "";
    return `<div class="row work">
      <span class="mono c-lane" style="display:flex;gap:8px;align-items:center">${dot(l.column)}${esc(l.lane)}</span>
      <div class="lead">${l.task ? `<span class="ell">${taskLink(p, l.task)}${l.title ? ` <span class="ttl">${ttl(l.title)}</span>` : ""}</span>` : '<span class="muted">no task</span>'}
        <span class="sub2 ell">${agentLink(p, l.agent)}${l.agent_status ? " · " + esc(l.agent_status) : ""}${
          job ? " · job " + job : ""}${l.warning ? " · " + pill("fail", l.warning) : ""}${l.op ? " · " + esc(l.op) : ""}</span>${bgHTML(l.background)}</div>
      <span>${pill(l.column)}</span>
      <span class="sub2 hide-sm">${l.spec_rev ? "spec r" + l.spec_rev : ""}${l.attempt > 1 ? " · attempt " + l.attempt : ""}${l.task && l.type ? " · " + esc(l.type) : ""}${l.effort ? " · effort " + esc(l.effort) : ""}</span>
      <span class="r muted small">${rel(l.since, "for")}</span>
    </div>`;
  }).join("");
  const roles = v.roles || [];
  // the lead's own row when it has background processes (T-714)
  const active = (v.lead && (v.lead.background || []).length ? [v.lead] : []).concat(roles.filter((x) => x.status || x.brief));
  const idleRoles = roles.filter((x) => !(x.status || x.brief));
  const rolesHTML = active.map((x) => `<div class="row roles">
      <span class="small" style="display:flex;gap:8px;align-items:center">${dot(x.status === "done" ? "idle" : x.status)}${esc(roleName(x.role))}</span>
      <div class="lead"><span>${agentLink(p, x.agent)}</span>
        ${x.brief ? `<span class="sub2">brief ${x.brief.worked ? "being worked" : x.brief.delivered ? "delivered" :
          "not delivered"} · ${rel(x.brief.since)}</span>` : ""}${bgHTML(x.background)}</div>
      <span>${x.status ? pill(x.status === "done" ? "idle" : x.status, x.status) : pill("idle", "no pane")}</span>
      <span class="r muted small">${x.age ? dur(x.age) : ""}</span>
    </div>`).join("");
  const freeLine = free.length ? `<p class="quiet">${dot("free")} ${free.length} lane${free.length > 1 ? "s" : ""} free:
      ${free.map((l) => `<span class="mono" title="${esc(l.task ? "last: " + l.task : "never used")}">${esc(l.lane)}</span>`).join(", ")}</p>` : "";
  const idleLine = idleRoles.length ? `<p class="quiet">${dot("idle")} No pane: ${idleRoles.map((x) =>
      `${esc(roleName(x.role))} (${agentLink(p, x.agent)})`).join(", ")}</p>` : "";
  const wip = `<section><h2>In progress <span class="count">${busy.length} of ${lanes.length} lanes</span></h2>
    ${work ? `<div class="card rows">${work}</div>` : '<p class="quiet">No lane is busy.</p>'}
    ${rolesHTML ? `<h3>Role agents</h3><div class="card rows">${rolesHTML}</div>` : ""}
    <div style="margin-top:10px">${freeLine}${idleLine}</div></section>`;

  return head + paused + needsHTML + wip + renderQueue(p, v, q) + renderEvents(p, v.events || []);
}

// The merge pipeline's stages as a person reads them (view.Stage*), held last and only when a task is.
const STAGES = [["submitted", "Submitted"], ["gating", "Gate"], ["review", "Review"], ["publish", "Merging"]];

function renderQueue(p, v, q) {
  const merge = q.merge || [];
  const parts = [];
  if (merge.length) {
    const stages = STAGES.concat(merge.some((m) => m.stage === "held") ? [["held", "Held"]] : []);
    const cols = stages.map(([key, label]) => {
      const items = merge.filter((m) => m.stage === key);
      return `<div class="stage ${items.length ? "" : "empty"}"><h4><span>${label}</span><span>${items.length || ""}</span></h4>
        ${items.map((m) => `<div class="item"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            ${dot(m.stage === "held" ? "held" : m.state)}${taskLink(p, m.task)}
            ${m.state !== key ? `<span class="muted small">${esc(m.state)}</span>` : ""}</div>
          ${m.title ? `<div class="sub2 ell" title="${esc(m.title)}">${ttl(m.title)}</div>` : ""}
          ${m.waits_on ? `<div class="sub2">waits on ${taskLink(p, m.waits_on)}${m.why ? " (" + esc(m.why) + ")" : ""}</div>` : ""}
          ${m.job ? `<div class="sub2">job ${jobLink(p, m.job.id, m.job.id.split("/").slice(2).join("/"))}${
            m.job.delivered ? "" : " · not fetched"}</div>` : ""}</div>`).join("")}</div>`;
    }).join("");
    const scratch = q.scratch ? `<p class="quiet small">Merge worktree: ${taskLink(p, q.scratch.task)} (${esc(q.scratch.why)})</p>` : "";
    parts.push(`<h3>Merge pipeline</h3><div class="pipe">${cols}</div>${scratch}`);
  }
  const waiting = q.waiting || [];
  if (waiting.length) parts.push(`<h3>Waiting to dispatch</h3><div class="card rows">${waiting.map((w) => `
    <div class="row roles"><span class="mono" style="display:flex;gap:8px;align-items:center">${dot("waiting")}${taskLink(p, w.task)}</span>
      <div class="lead">${w.title ? `<span class="ttl ell">${ttl(w.title)}</span>` : ""}<span class="sub2">${linked(p, waitWhy(w))}</span></div>
      <span>${pill(w.waits_on === "never dispatched" ? "idle" : "waiting", w.waits_on)}</span>
      <span class="r muted small">${rel(w.since)}</span></div>`).join("")}</div>`);
  const review = q.review || [];
  if (review.length || v.review) parts.push(`<h3>Review cycle</h3><div class="card rows">${review.map((x) => `
    <div class="row roles"><span class="small" style="display:flex;gap:8px;align-items:center">${dot(x.state === "ready" ? "ready" : "waiting")}review</span>
      <div class="lead"><span>${x.note ? linked(p, x.note) : "review requested"}</span>
        <span class="sub2">${x.after && x.after.length ? "after " + x.after.map((t) => taskLink(p, t)).join(", ") : ""}${
          x.waiting && x.waiting.length ? " · waits on " + x.waiting.map((t) => taskLink(p, t)).join(", ") : ""}${
          x.held ? " · holds " + taskLink(p, x.held) : ""}${x.by ? " · by " + esc(x.by) : ""}</span></div>
      <span>${pill(x.state === "ready" ? "ready" : "waiting", x.state)}</span><span class="r muted small">${rel(x.since)}</span></div>`).join("")}
    ${!review.length && v.review ? `<div class="row"><span>${linked(p, v.review)}</span></div>` : ""}</div>`);
  const watches = v.watches || [];
  if (watches.length) parts.push(`<h3>Watches</h3><div class="card rows">${watches.map((w) => `
    <div class="row roles"><span class="mono" style="display:flex;gap:8px;align-items:center">${dot("idle")}${
      w.task.split(",").map((t) => taskLink(p, t.trim())).join(", ")}</span>
      <div class="lead"><span class="ttl">${w.note ? linked(p, w.note) : '<span class="muted">no note</span>'}</span></div>
      <span class="sub2">${esc(w.by || "")}</span><span class="r muted small">${rel(w.since)}</span></div>`).join("")}</div>`);
  const outbox = q.outbox || [];
  if (outbox.length) parts.push(`<h3>Not delivered yet</h3><div class="card list">${outbox.map((o) => `
    <div class="li"><time>${o.since ? esc(dur(now() - o.since)) : ""}</time><span class="txt">${o.kind === "line"
      ? `<span class="muted">→</span> ${agentLink(p, o.to)} <q>${linked(p, human(o.line))}</q>${o.from ? ` <span class="muted small">from ${esc(o.from)}</span>` : ""}`
      : `brief to ${agentLink(p, o.to)} <span class="muted">${o.worked ? "being worked" : o.delivered ? "delivered" : "not delivered"}</span>`}</span></div>`).join("")}</div>`);

  const foot = [];
  if (q.nightly) foot.push(`nightly check at <span class="mono">${esc(q.nightly.at)}</span> (${rel(q.nightly.next, "in")})`);
  if (v.full_check) foot.push(`last full check ${pill(v.full_check.verdict === "GREEN" ? "green" : "fail", v.full_check.verdict)}
    <span class="mono">${esc((v.full_check.sha || "").slice(0, 7))}</span> ${rel(v.full_check.at)}`);
  const footHTML = foot.length ? `<p class="quiet small" style="flex-wrap:wrap">${foot.join(" · ")}</p>` : "";
  const count = merge.length + waiting.length;
  return `<section><h2>Queue ${count ? `<span class="count">${count}</span>` : ""}</h2>
    ${parts.length ? parts.join("") : '<p class="quiet">Nothing is queued.</p>'}${footHTML}</section>`;
}

function waitWhy(w) {
  if (w.waits_on === "after") return "after " + (w.after || []).join(", ") + (w.why ? " · " + w.why : "");
  if (w.waits_on === "never dispatched") return "spec r" + (w.rev || 0) + " stored, never dispatched";
  return "waits for a free " + (w.level ? w.level + " " : "") + "lane" + (w.types && w.types.length ? " (" +
    w.types.join(", ") + ")" : "") + (w.why ? " · " + w.why : "");
}

function renderEvents(p, events) {
  if (!events.length) return "";
  return `<section><h2>Recent events</h2><div class="card list">${events.map((e) => {
    const at = unixOf(e.ts);
    return `<div class="li" data-seq="${esc(e.seq + ":" + e.ts)}">${rel(at) || "<time></time>"}
      <span class="txt">${eventHTML(p, e.line)}</span></div>`;
  }).join("")}</div></section>`;
}

// ---- setup (T-750) -------------------------------------------------------------------------------------------------
// The setup page: what steers the project's work — its difficulty levels, lanes, roles and pause — and how its
// dispatches spread by level and chosen type, for the last 7 days or for all records. Read-only: the switch only
// redraws the table.
let distAll = false;

async function setupPage(r) {
  const s = await api("/api/setup?project=" + enc(r.project));
  return renderSetup(r.project, s);
}

// levelName is a distribution row's label: a level, --types' override, or a dispatch with neither.
const levelName = (l) => l || "no level";
const typeName = (t) => t || "pooled";

function renderSetup(p, s) {
  const head = `<div class="head"><h1>${esc(p)} <span class="title">setup</span></h1>
    <div class="meta"><span class="small">what steers this project's work · read-only</span>
      <a class="ln" href="${href("p", p)}">project</a></div></div>`;

  const levels = s.difficulty || [];
  const difficulty = levels.map((d) => `<div class="row setup2">
      <span class="mono">${esc(d.level)}</span>
      <div class="lead"><span>${(d.types || []).length ? d.types.map((t) => tag(t)).join(" ")
        : '<span class="muted">no type</span>'}</span></div></div>`).join("");
  // what runs each type: its lane type, kind, model, effort and max; the types no level and no role names come last,
  // marked unused (T-750)
  const types = s.types || [];
  const typeRows = types.map((t) => `<tr>
      <td class="mono">${esc(t.ref)}${t.unused ? ' <span class="pill plain t-idle">unused</span>' : ""}</td>
      <td class="mono">${esc(t.name || "")}</td>
      <td>${esc(t.kind || "")}</td>
      <td>${t.model ? esc(t.model) : '<span class="muted">—</span>'}</td>
      <td>${t.effort ? esc(t.effort) : '<span class="muted">—</span>'}</td>
      <td>${t.max ? esc(t.max) : '<span class="muted">no cap</span>'}</td></tr>`).join("");
  const typeTable = types.length ? `<table class="raw types">
      <thead><tr><th>type ref</th><th>lane type</th><th>kind</th><th>model</th><th>effort</th><th>max</th></tr></thead>
      <tbody>${typeRows}</tbody></table>` : "";
  const difficultyHTML = `<section><h2>Difficulty</h2><div class="card">
    <div class="rows">${difficulty || '<p class="quiet">No difficulty level.</p>'}</div>
    ${typeTable ? `<div class="pad" style="border-top:1px solid var(--line-soft)">${typeTable}</div>` : ""}</div></section>`;

  const lanes = s.lanes || [];
  const pooled = lanes.filter((l) => !l.type).length;
  const laneHTML = lanes.map((l) => `<div class="row setup3">
      <span class="mono">${esc(l.lane)}</span>
      <div class="lead"><span>${l.type ? tag(l.type) : pill("idle", "pooled")}</span>
        <span class="sub2">${agentLink(p, l.agent)}</span></div>
      <span>${l.state ? pill(l.state) : pill("idle", "no state")}</span></div>`).join("");
  const lanesHTML = `<section><h2>Lanes <span class="count">${lanes.length} lane${lanes.length === 1 ? "" : "s"} ·
    ${pooled} pooled · ${lanes.length - pooled} typed</span></h2>
    <div class="card rows">${laneHTML || '<p class="quiet">No lane configured.</p>'}</div></section>`;

  const roleHTML = (s.roles || []).map((x) => `<div class="row setup3">
      <span class="small">${esc(roleName(x.role))}</span>
      <div class="lead"><span>${x.agent ? agentLink(p, x.agent) : '<span class="muted">no agent</span>'}</span>
        <span class="sub2">${x.type ? tag(x.type) : "no type"}</span></div>
      <span>${x.status ? pill(x.status) : pill("idle", "no pane")}</span></div>`).join("");
  const paused = s.paused ? `<div class="banner t-wait" style="margin:8px 0 0">⏸ <span>Paused${
    s.paused.until ? " " + rel(s.paused.until, "in") : ""}${s.paused.reason ? ": " + esc(s.paused.reason) : ""}${
    s.paused.by ? ` <span class="muted">· ${esc(s.paused.by)}</span>` : ""}</span></div>` : "";
  const rolesHTML = `<section><h2>Roles and pause</h2><div class="card rows">${
    roleHTML || '<p class="quiet">No role configured.</p>'}</div>${paused}</section>`;

  // the distribution: level rows × chosen type columns, one cell per level and type the store counted
  const cells = s.distribution || [];
  const rows = [];
  const cols = [];
  for (const c of cells) {
    if (!rows.includes(c.level)) rows.push(c.level);
    if (!cols.includes(c.type)) cols.push(c.type);
  }
  cols.sort((a, b) => (a === "" ? 1 : b === "" ? -1 : a.localeCompare(b)));
  const count = (level, type) => {
    const c = cells.find((x) => x.level === level && x.type === type);
    return c ? (distAll ? c.all : c.recent) : 0;
  };
  const table = cells.length ? `<table class="raw dist">
    <thead><tr><th>level</th>${cols.map((t) => `<th>${esc(typeName(t))}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((l) => `<tr><th>${esc(levelName(l))}</th>${
      cols.map((t) => `<td>${count(l, t)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    : '<p class="quiet">No dispatch has placed a task on a lane yet.</p>';
  const seg = `<span class="seg">${[["recent", "7 days"], ["all", "all"]].map(([k, label]) =>
    `<button data-dist="${k}" class="${(k === "all") === distAll ? "on" : ""}">${label}</button>`).join("")}</span>`;
  const distHTML = `<section><h2>Distribution ${seg}</h2>
    <div class="card" style="overflow:auto;padding:4px 0">${table}</div></section>`;

  return head + difficultyHTML + lanesHTML + rolesHTML + distHTML;
}

// ---- prompts (a task's or agent's jobs, briefs) ------------------------------------------------------------------
// prompt is one prompt: its header, and its text inline; a long one folds, the first of a list open.
function prompt(p, j, key, open, showTask) {
  const lines = String(j.text || "").split("\n").length;
  const head = `<span class="chev">▸</span> ${j.job ? `<strong class="mono">${esc(j.job)}</strong>` : `<strong>${esc(j.kind)}</strong>`}
    <span class="muted small">${esc(j.agent || "")}${showTask && j.task ? " · " + esc(j.task) : ""} · ${rel(unixOf(j.ts))} · ${lines} lines</span>`;
  const links = `<span class="small">${j.job ? jobLink(p, j.job, "open") : ""}${j.agent ? " · " + agentLink(p, j.agent) : ""}</span>`;
  return `<details class="block" data-key="${esc(key)}"${open || lines <= 14 ? " open" : ""}>
    <summary class="bhead">${head}</summary>
    <pre class="text">${esc(j.text)}</pre><div class="bhead" style="padding-top:0">${links}</div></details>`;
}

// ---- task -----------------------------------------------------------------------------------------------------------
async function taskPage(r) {
  const t = await api(`/api/task?project=${enc(r.project)}&task=${enc(r.id)}`);
  return renderTask(r.project, t);
}

// milestone is a record as one line of the task's timeline ("" for the bookkeeping a person need not read).
function milestone(rec) {
  const base = rec.step.replace(/\.\d+$/, "");
  const method = rec.step.split(".")[0];
  if (rec.kind === "fact") {
    switch (rec.step) {
      case "dispatch": return ["ok", rec.line || "dispatched"];
      case "waiting": return ["wait", "waits to be dispatched"];
      case "delivered": return ["idle", "job fetched by its agent"];
      case "submitted": return ["ok", "submitted"];
      case "sendback": return ["wait", rec.line || "sent back"];
      case "needs-you": return ["bad", rec.line || "needs you"];
      case "merged": return ["ok", rec.line || "merged"];
      case "target.moved": return ["idle", "target moved: the gate runs again"];
    }
    return rec.line ? ["idle", rec.line] : null;
  }
  if (rec.kind !== "result") return null;
  if (base === "gate") return [/ pass /.test(rec.line || "") ? "ok" : "bad", rec.line || "gate"];
  if (method === "accept") return ["ok", "accepted"];
  if (method === "sendback") return ["wait", rec.line || "sent back"];
  if (base === "review" || base === "resolve") return ["idle", base === "review" ? "review job sent" : "resolve job sent"];
  if (base === "work" || base === "fix") return ["idle", base + " job sent"];
  return rec.line ? ["idle", rec.line] : null;
}

// stageOfTask is the task's place in dispatched → working → submitted → gate → review → merging → merged, with its
// tone. Accepted and published are merging (the publish), never merged: merged is the merged fact alone, every step
// done.
const TASK_STEPS = ["dispatched", "working", "submitted", "gate", "review", "merging", "merged"];
const STATE_STEP = { waiting: 0, dispatched: 0, working: 1, submitted: 2, resolved: 3, moved: 3, red: 3, green: 4,
  "awaiting-accept": 4, conflict: 4, resolving: 4, accepted: 5, published: 5 };
// recordStep is the step a record shows the task reached, by the indices of STATE_STEP (-1: none).
function recordStep(r) {
  const step = r.step || "";
  if (r.kind === "fact") return { dispatch: 0, delivered: 1, sendback: 1, submitted: 2 }[step] ?? -1;
  if (r.kind !== "result") return -1;
  if (step.startsWith("accept") || step.startsWith("publish")) return 5;
  if (step.startsWith("gate")) return / pass /.test(r.line || "") ? 4 : 3;
  if (step.startsWith("review")) return 4;
  return -1;
}
function stageOfTask(t) {
  const recs = t.records || [];
  if (recs.some((r) => r.kind === "fact" && r.step === "merged")) {
    return { i: TASK_STEPS.length, tone: "ok", state: "merged" };
  }
  const st = t.state || "";
  if (st in STATE_STEP) return { i: STATE_STEP[st], tone: tone(st), state: st };
  // needs-you, fail or ended: the furthest step its records reached, held there.
  const i = recs.reduce((m, r) => Math.max(m, recordStep(r)), 0);
  return { i, tone: st ? tone(st) : "idle", state: st || (recs.length ? "ended" : "") };
}
function steps(t) {
  const s = stageOfTask(t);
  return `<div class="steps">${TASK_STEPS.map((name, i) => {
    const cls = i < s.i ? "done" : i === s.i ? "cur" : "";
    const color = i === s.i ? ` style="color:var(--${s.tone === "idle" ? "fg" : s.tone})"` : "";
    return `<div class="step ${cls}"${color}>${i ? '<span class="bar"></span>' : ""}<span class="n">${i < s.i ? "✓" : i + 1}</span>${name}</div>`;
  }).join("")}</div>`;
}

function renderTask(p, t) {
  const s = stageOfTask(t);
  const meta = [];
  if (s.state) meta.push(pill(s.state === "ended" ? "idle" : s.state, s.state));
  if (t.lane) meta.push(`lane <b class="mono">${esc(t.lane)}</b>`);
  if (t.agent) meta.push(`agent ${agentLink(p, t.agent)}`);
  if (t.attempt) meta.push(`attempt <b>${t.attempt}</b>`);
  if (t.spec_rev) meta.push(`spec <b>r${t.spec_rev}</b>`);
  if (t.dispatched_at) meta.push(`dispatched ${rel(t.dispatched_at)}`);
  const out = [`<div class="head"><h1>${esc(t.task)}${t.title ? ` <span class="title">${ttl(t.title)}</span>` : ""}</h1>
    <div class="meta">${meta.join('<span class="muted">·</span>')}</div>${(t.records || []).length ? steps(t) : ""}</div>`];

  if ((t.needs_you || []).length) out.push(`<section><h2>Needs you</h2><div class="card needs">${t.needs_you.map((n) => `
    <div class="need"><div class="why">${linked(p, human(n.reason))}</div>
      ${n.answer ? `<code class="answer">${esc(n.answer)}</code>` : ""}</div>`).join("")}</div></section>`);

  if (t.gate_line) {
    const green = /^GREEN/.test(t.gate_line);
    out.push(`<section><h2>Gate</h2><div class="card pad" style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      ${pill(green ? "green" : "fail", green ? "pass" : "fail")}
      <div style="flex:1;min-width:0"><div class="mono" style="overflow-wrap:anywhere">${esc(human(t.gate_line))}</div>
      <div class="sub2">${t.gated_rev ? "checked spec r" + t.gated_rev + (t.spec_rev && t.spec_rev !== t.gated_rev ?
        ` · <span style="color:var(--wait)">spec is r${t.spec_rev} now</span>` : "") + " · " : ""}log <span class="mono">${esc(t.gate_log || "")}</span></div></div>
    </div></section>`);
  }
  const grid = [];
  if (t.report) grid.push(`<section><h2>Report</h2><div class="card">${folded("report", md(t.report, p), t.report.length > 1400)}</div></section>`);
  if (t.spec) grid.push(`<section><h2>Spec <span class="count">r${t.spec_rev}</span></h2><div class="card">${folded("spec", md(t.spec, p), t.spec.length > 1400)}</div></section>`);
  out.push(...grid);

  if ((t.jobs || []).length) out.push(`<section><h2>Jobs <span class="count">${t.jobs.length}</span></h2><div class="card">${
    t.jobs.map((j, i) => prompt(p, j, "job:" + j.seq, i === 0 && j.text.length < 6000)).join("")}</div></section>`);

  const tl = (t.records || []).map((r) => ({ r, m: milestone(r) })).filter((x) => x.m);
  if (tl.length) out.push(`<section><h2>Timeline</h2><div class="card list">${tl.map(({ r, m }) => `
    <div class="li" data-seq="${esc(r.seq)}">${rel(unixOf(r.ts))}<span class="txt" style="display:flex;gap:9px;align-items:baseline">
      ${dot(m[0] === "ok" ? "working" : m[0] === "wait" ? "waiting" : m[0] === "bad" ? "fail" : "idle")}
      <span>${linked(p, human(m[1]))}</span></span></div>`).join("")}</div>
    <details data-key="raw" style="margin-top:8px"><summary class="toggle"><span class="chev">▸</span> raw records (${t.records.length})</summary>
      <div class="card" style="overflow:auto"><table class="raw"><tr><th>seq</th><th>time</th><th>step</th><th>kind</th><th>line</th></tr>
      ${t.records.map((r) => `<tr><td class="mono muted">${esc(r.seq)}</td><td class="mono muted nowrap">${esc(clock(unixOf(r.ts)))}</td>
        <td class="mono">${esc(r.step)}</td><td class="muted">${esc(r.kind)}</td><td>${esc(r.line || "")}</td></tr>`).join("")}
      </table></div></details></section>`);
  return out.join("");
}

// ---- agent ----------------------------------------------------------------------------------------------------------
async function agentPage(r) {
  const a = await api(`/api/agent?project=${enc(r.project)}&agent=${enc(r.id)}`);
  return renderAgent(r.project, a);
}

function renderAgent(p, a) {
  const meta = [];
  meta.push(a.status ? pill(a.status === "done" ? "idle" : a.status, a.status) : pill("idle", "no pane"));
  if (a.task) meta.push(`on ${taskLink(p, a.task)}`);
  if (a.lane) meta.push(`lane <b class="mono">${esc(a.lane)}</b>`);
  const out = [`<div class="head"><h1>${esc(a.agent)}</h1><div class="meta">${meta.join('<span class="muted">·</span>')}</div></div>`];
  if ((a.background || []).length) out.push(`<section><h2>Long-running processes <span class="count">${a.background.length}</span></h2><div class="card list">${
    a.background.map((b) => `<div class="li"><span class="muted small">${bgKind(b)} ${dur(b.age)}</span><span class="txt">${
      b.label ? esc(b.label) + ` <span class="muted small mono">${esc(b.command)}</span>` : `<span class="mono">${esc(b.command)}</span>`}</span></div>`).join("")}</div></section>`);
  if ((a.jobs || []).length) out.push(`<section><h2>Jobs <span class="count">${a.jobs.length}</span></h2><div class="card">${
    a.jobs.map((j, i) => prompt(p, j, "job:" + j.seq, i === 0 && j.text.length < 6000, true)).join("")}</div></section>`);
  if ((a.briefs || []).length) out.push(`<section><h2>Briefs <span class="count">${a.briefs.length}</span></h2><div class="card">${
    a.briefs.map((j, i) => prompt(p, j, "brief:" + j.seq, i === 0, true)).join("")}</div></section>`);
  if ((a.lines || []).length) out.push(`<section><h2>Lines sent <span class="count">${a.lines.length}</span></h2><div class="card list">${
    a.lines.map((l) => `<div class="li" data-seq="${esc(l.seq)}">${rel(unixOf(l.ts))}<span class="txt">${
      l.from ? `<span class="muted small">${esc(l.from)}</span> ` : ""}${linked(p, human(l.line))}</span></div>`).join("")}</div></section>`);
  if ((a.sessions || []).length) out.push(`<section><h2>Sessions <span class="count">${a.sessions.length}</span></h2><div class="card rows">${
    a.sessions.map((s) => `<div class="row roles">
      <span class="mono small ell" title="${esc(s.id)}">${esc(s.id.slice(0, 8))}</span>
      <div class="lead"><span>${esc(s.kind || "")}${s.task ? " · " + taskLink(p, s.task) : ""}${s.lane ? " · " + esc(s.lane) : ""}${
        s.pane ? ` <span class="muted small">pane ${esc(s.pane)}</span>` : ""}</span>
        ${s.transcript ? `<span class="sub2 ell mono" title="${esc(s.transcript)}">${esc(human(s.transcript))}</span>` : ""}</div>
      <span class="sub2">started ${rel(s.started)}</span>
      <span class="r muted small">${s.last_write ? "wrote " + rel(s.last_write) : ""}</span></div>`).join("")}</div></section>`);
  if (out.length === 1) out.push('<p class="quiet">Nothing recorded for this agent yet.</p>');
  return out.join("");
}

// ---- job ------------------------------------------------------------------------------------------------------------
async function jobPage(r) {
  const j = await api(`/api/job?project=${enc(r.project)}&job=${enc(r.id)}`);
  const meta = [pill("idle", j.kind)];
  if (j.task) meta.push(`task ${taskLink(r.project, j.task)}`);
  if (j.agent) meta.push(`agent ${agentLink(r.project, j.agent)}`);
  meta.push(`sent ${rel(unixOf(j.ts))}`);
  return `<div class="head"><h1 class="mono" style="font-size:19px">${esc(j.job || j.kind)}</h1>
    <div class="meta">${meta.join('<span class="muted">·</span>')}</div></div>
    <section><h2>Prompt <span class="count">${String(j.text || "").split("\n").length} lines</span></h2>
    <div class="card"><pre class="text" style="max-height:none">${esc(j.text)}</pre></div></section>`;
}

// ---- theme ----------------------------------------------------------------------------------------------------------
const themeBtn = document.getElementById("theme");
const applyTheme = (t) => t ? document.documentElement.setAttribute("data-theme", t)
  : document.documentElement.removeAttribute("data-theme");
applyTheme(localStorage.getItem("obor-theme"));
themeBtn.addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = localStorage.getItem("obor-theme") || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  localStorage.setItem("obor-theme", next);
  applyTheme(next);
});

go();
</script>

</html>
