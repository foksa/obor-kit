# herdr plugin for obor (design "herdr integration (v2.10)", stage 1). Linked once per user by `obor setup
# herdr-plugin` (herdr plugin link ~/.obor/herdr-plugin, a symlink to the kit's herdr-plugin/).
# The command runs `obor plugin restore` (internal/launch's Restorer) through the kit's bin/obor, relative to the plugin directory
# (herdr's cwd for plugin commands; `..` of the symlink is the kit). It returns at once and works in the background:
# after herdr restores a session, obor restarts its labelled panes with `obor restart` (needs `[session]
# resume_agents_on_restore = false` in herdr's config; R-28 §1). Optional since T-1051: obor serve restores its own
# project's panes once its connection to herdr is back; the plugin is the faster trigger, and the two runs restart a
# pane at most once (the project's restore lock). Outside an obor project it does nothing. (The pane
# event kicks of the heartbeat went with it, T-465.)
id = "obor.events"
name = "obor events"
version = "0.4.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

[[startup]]
command = ["/bin/bash", "../bin/obor", "plugin", "restore"]

